name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run linting
      run: |
        ruff check src/
        ruff format --check src/

    - name: Run type checking
      run: |
        mypy src/

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Validate schemas
      run: |
        python -c "
        from polaris_harness.validation import validate_scenario_file
        import sys
        from pathlib import Path
        
        # Validate all scenario files
        scenarios_dir = Path('scenarios')
        for scenario_dir in scenarios_dir.iterdir():
            if scenario_dir.is_dir():
                scenario_file = scenario_dir / 'scenario.yaml'
                if scenario_file.exists():
                    errors = validate_scenario_file(scenario_file)
                    if errors:
                        print(f'Errors in {scenario_dir.name}:')
                        for error in errors:
                            print(f'  {error}')
                        sys.exit(1)
        print('All scenario files are valid')
        "

    - name: Validate evidence files
      run: |
        python -c "
        from polaris_harness.validation import validate_evidence_file
        import sys
        from pathlib import Path
        
        # Validate evidence files if they exist
        evidence_dir = Path('scenarios')
        for scenario_dir in evidence_dir.iterdir():
            if scenario_dir.is_dir():
                evidence_file = scenario_dir / 'evidence.yaml'
                if evidence_file.exists():
                    errors = validate_evidence_file(evidence_file)
                    if errors:
                        print(f'Errors in {scenario_dir.name} evidence:')
                        for error in errors:
                            print(f'  {error}')
                        sys.exit(1)
        print('All evidence files are valid')
        "

    - name: Run smoke tests
      run: |
        pytest tests/test_smoke.py -v --tb=short

    - name: Run integration tests
      run: |
        pytest tests/test_integration.py -v --tb=short

    - name: Run basic functionality tests
      run: |
        pytest tests/test_basic_functionality.py -v --tb=short

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          test-results.xml
          coverage.xml
        retention-days: 7

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Validate all schemas
      run: |
        python -c "
        from polaris_harness.validation import (
            validate_scenario_file,
            validate_evidence_file,
            validate_personality_file,
            validate_runtime_manifest_file,
        )
        from pathlib import Path
        import sys
        
        errors_found = False
        
        # Validate scenario schemas
        schemas_dir = Path('schemas')
        for schema_file in schemas_dir.glob('*.json'):
            print(f'Validating schema: {schema_file.name}')
        
        # Validate scenario files
        scenarios_dir = Path('scenarios')
        for scenario_dir in scenarios_dir.iterdir():
            if scenario_dir.is_dir():
                scenario_file = scenario_dir / 'scenario.yaml'
                if scenario_file.exists():
                    print(f'Validating scenario: {scenario_dir.name}')
                    errors = validate_scenario_file(scenario_file)
                    if errors:
                        print(f'  Errors: {errors}')
                        errors_found = True
        
        # Validate evidence files
        for scenario_dir in scenarios_dir.iterdir():
            if scenario_dir.is_dir():
                evidence_file = scenario_dir / 'evidence.yaml'
                if evidence_file.exists():
                    print(f'Validating evidence: {scenario_dir.name}')
                    errors = validate_evidence_file(evidence_file)
                    if errors:
                        print(f'  Errors: {errors}')
                        errors_found = True
        
        if errors_found:
            print('Schema validation failed')
            sys.exit(1)
        else:
            print('All schemas are valid')
        "

  documentation:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Check documentation
      run: |
        # Check that all required documentation files exist
        required_files = [
            'README.md',
            'docs/USER-GUIDE.md',
            'docs/API-REFERENCE.md',
            'docs/SCENARIO-AUTHORING.md'
        ]
        
        for file in required_files:
            if not Path(file).exists():
                echo "Missing required documentation file: $file"
                exit 1
        
        echo "All required documentation files are present"

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, schema-validation, documentation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Run quality checks
      run: |
        # Run all quality checks
        echo "Running linting..."
        ruff check src/
        
        echo "Running formatting check..."
        ruff format --check src/
        
        echo "Running type checking..."
        mypy src/
        
        echo "Running tests..."
        pytest tests/ -v --tb=short
        
        echo "Quality gate passed"

    - name: Generate coverage report
      run: |
        pytest tests/ --cov=src/polaris_harness --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 7

    - name: Notify on failure
      if: failure()
      run: |
        echo "Quality gate failed. Please review the logs above."
        echo "Check the Actions tab for detailed output."