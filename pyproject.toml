[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polaris-harness"
version = "0.1.0"
description = "Deterministic protocol/runtime test harness for Benro Polaris ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Ian Morgan", email = "github@morgan-multinational.co.uk"}
]
keywords = ["test", "harness", "protocol", "firmware", "polaris", "benro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware"
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.19.0",
    "Flask>=3.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "unicorn>=2.0.0",  # ARM CPU emulation framework (issue #15)
]

[project.scripts]
polaris-harness = "polaris_harness.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polaris_harness"]

# Runtime data the package reads at first use. Both consumers resolve it
# relative to the repository root, which does not exist in a site-packages
# install: validation.py opens schemas/*.schema.json and astro_webui opens
# tests/fixtures/astro/astro_assets.json. Without these the built wheel
# installs cleanly and then dies on `polaris-harness --help`.
#
# ARM fixture binaries are deliberately NOT included - they are private
# research artifacts, gitignored, and reach the harness via
# --fixtures-dir or POLARIS_ARM_FIXTURES_DIR.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "polaris_harness/_data/schemas"
"tests/fixtures/astro" = "polaris_harness/_data/astro_assets"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests/"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
